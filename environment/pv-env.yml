## PV tracking environment (conda-forge only; no MuJoCo).
## The default Anaconda channel is blocked on some VMs (HTTP 403).
##
##   cd /home/user01/mbpo_custom
##   source ~/miniconda3/etc/profile.d/conda.sh
##   conda env create -f environment/pv-env.yml
##   conda activate mbpo
##   pip install 'pvlib==0.10.4' 'tables==3.7.0' --no-deps
##   pip install 'opencv-python-headless==4.2.0.34'
##   pip install -e viskit
##   pip install -e .

name: mbpo
channels:
  - conda-forge
dependencies:
  - python=3.7
  - pip>=20.0
  - patchelf
  - pip:
      - -r requirements-pv.txt
